name: Daily News Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # 每天北京时间10点运行
  workflow_dispatch:      # 允许手动触发

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Fetch news
        run: node scripts/fetch-news.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Filter news
        run: node scripts/filter-news.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Translate news
        run: node scripts/translate-news.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Extract UI strings
        run: node scripts/extract-ui-strings.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/ public/locales/
          git diff --staged --quiet || git commit -m "chore: daily news update $(date +'%Y-%m-%d')"
          git push